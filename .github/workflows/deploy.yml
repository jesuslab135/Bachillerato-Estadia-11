# SGA-Militar backend — CI/CD hacia el VPS de IONOS.
# push a main: pruebas -> imagen a GHCR (sga-backend:prod) -> despliegue por SSH.
# Secrets requeridos en el repo: VPS_HOST, VPS_USER, VPS_SSH_KEY.

name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sga
          POSTGRES_PASSWORD: sga_dev
          POSTGRES_DB: sga_militar
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sga -d sga_militar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sga:sga_dev@localhost:5433/sga_militar?schema=public
      JWT_SECRET: ci-secret-solo-pruebas
      JWT_EXPIRES_IN: 8h
      AUTH_MAX_INTENTOS: "5"
      AUTH_BLOQUEO_MINUTOS: "15"
      SEED_PASSWORD: SgaTemporal2026!
      THROTTLE_LOGIN_LIMIT: "30"
      THROTTLE_LOGIN_TTL: "60000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run seed
      - run: npm test
      - run: npm run build
      - run: npm run lint

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sga-backend:prod
            ghcr.io/${{ github.repository_owner }}/sga-backend:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Desplegar en el VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/sga
            docker compose pull backend
            docker compose up -d backend
            docker image prune -f
